# استقرار خودکار روی GitHub Pages با هر push به شاخه main
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Custom domain (اختیاری)
        # در GitHub: Settings → Secrets and variables → Actions → Variables → CUSTOM_DOMAIN = biznesyar.ir
        run: |
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then echo "${{ vars.CUSTOM_DOMAIN }}" > public/CNAME; fi
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_MODE: ${{ vars.SITE_MODE }}
          PUBLIC_GFORM_ACTION: ${{ vars.PUBLIC_GFORM_ACTION }}
          PUBLIC_GFORM_FIELDS: ${{ vars.PUBLIC_GFORM_FIELDS }}
          PUBLIC_LEADS_MIRROR: ${{ vars.PUBLIC_LEADS_MIRROR }}
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
