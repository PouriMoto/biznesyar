# استقرار اختیاری روی هاست/VPS ایرانی با rsync (دستی اجرا می‌شود).
# فقط وقتی لازم است که بخواهی سایت را روی سرور خودت بگذاری، نه GitHub Pages.
name: Deploy to SSH server
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_MODE: ${{ vars.SITE_MODE }}
          PUBLIC_GFORM_ACTION: ${{ vars.PUBLIC_GFORM_ACTION }}
          PUBLIC_GFORM_FIELDS: ${{ vars.PUBLIC_GFORM_FIELDS }}
          PUBLIC_LEADS_MIRROR: ${{ vars.PUBLIC_LEADS_MIRROR }}
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
      - name: rsync
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_KEY" > key
          rsync -az --delete -e "ssh -i key -p ${SSH_PORT:-22} -o StrictHostKeyChecking=accept-new" dist/ "$SSH_USER@$SSH_HOST:/var/www/bizyaar/"
